<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>OnCar</title>
</head>
<body>

<!-- Cabecalho comum a todas as telas -->
<div th:fragment="cabecalho">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">OnCar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/movimentacoes}">Movimentacoes</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('PROPRIETARIO','GERENTE_ESTOQUE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('PROPRIETARIO','GERENTE_ESTOQUE')">
                        <a class="nav-link" th:href="@{/fornecedores}">Fornecedores</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('PROPRIETARIO')">
                        <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('PROPRIETARIO')">
                        <a class="nav-link" th:href="@{/auditoria}">Auditoria</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="navbar-text me-3" sec:authentication="name">usuario</span>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/conta/senha}">Alterar senha</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Mensagens de sucesso e de erro (RNF13) -->
<div th:fragment="mensagens">
    <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}"></div>
</div>

<!-- Scripts comuns -->
<div th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</div>

</body>
</html>
