<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnCar - Entrada de mercadoria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/oncar.css}">
</head>
<body>
<div th:replace="~{layout/base :: cabecalho}"></div>

<div class="container">
    <div th:replace="~{layout/base :: mensagens}"></div>

    <h1 class="h4 mb-3">Registrar entrada de mercadoria</h1>
    <p class="text-muted small">O saldo e o custo medio ponderado do produto sao atualizados automaticamente
        (RF10 e RN004).</p>

    <form class="card card-body" method="post" th:action="@{/movimentacoes/entrada}" th:object="${entradaForm}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="produtoId">Produto</label>
                <select class="form-select" id="produtoId" th:field="*{produtoId}">
                    <option value="">Selecione</option>
                    <option th:each="produto : ${produtos}" th:value="${produto.id}"
                            th:text="${produto.sku} + ' - ' + ${produto.descricao}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('produtoId')}" th:errors="*{produtoId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="fornecedorId">Fornecedor</label>
                <select class="form-select" id="fornecedorId" th:field="*{fornecedorId}">
                    <option value="">Nao informado</option>
                    <option th:each="fornecedor : ${fornecedores}" th:value="${fornecedor.id}"
                            th:text="${fornecedor.razaoSocial}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="quantidade">Quantidade</label>
                <input class="form-control" type="number" step="0.001" id="quantidade" th:field="*{quantidade}">
                <div class="text-danger small" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="custoUnitario">Custo unitario (R$)</label>
                <input class="form-control" type="number" step="0.0001" id="custoUnitario" th:field="*{custoUnitario}">
                <div class="text-danger small" th:if="${#fields.hasErrors('custoUnitario')}"
                     th:errors="*{custoUnitario}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="documento">NF-e (opcional)</label>
                <input class="form-control" id="documento" th:field="*{documento}" placeholder="Ex: NF-e 10021">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="competencia">Data de competencia</label>
                <input class="form-control" type="date" id="competencia" th:field="*{competencia}">
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-success" type="submit">Registrar entrada</button>
            <a class="btn btn-outline-secondary" th:href="@{/movimentacoes}">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
