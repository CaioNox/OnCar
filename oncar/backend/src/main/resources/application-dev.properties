# OnCar - perfil de desenvolvimento (H2 em memoria com dados de demonstracao)
# Ativado por `./mvnw spring-boot:run` (propriedade spring-boot.run.profiles do pom.xml).

spring.datasource.url=jdbc:h2:mem:oncar;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false

# A carga de demonstracao (CargaInicial) cria usuarios com a senha publica "oncar2026".
# Por isso o perfil dev so atende na propria maquina: ninguem na mesma rede Wi-Fi
# consegue entrar com essas contas. Para testar de outro aparelho, rode com
# --server.address=0.0.0.0 sabendo que as contas de demonstracao ficam expostas.
server.address=127.0.0.1
