# OnCar - configuracao comum a todos os perfis
spring.application.name=oncar

# Sem perfil informado, a aplicacao sobe como PRODUCAO: sem usuarios de demonstracao e
# exigindo as variaveis do banco (ONCAR_DB_*). Assim um `java -jar` esquecido no
# servidor nunca abre a base de demonstracao com senha conhecida.
#   - desenvolvimento: `./mvnw spring-boot:run` ja ativa o perfil dev (ver pom.xml)
#   - Docker: o docker-compose.yml define SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=prod

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# O console web do H2 executa SQL arbitrario no banco e nao convive com a protecao
# CSRF; fica desligado em todos os perfis.
spring.h2.console.enabled=false

# sessao expira apos 30 minutos de inatividade
server.servlet.session.timeout=30m

# Mensagens de erro em portugues
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
