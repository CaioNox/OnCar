# OnCar - configuracao padrao de desenvolvimento (H2 em memoria)
spring.application.name=oncar
spring.profiles.active=dev

# Banco de dados em memoria para desenvolvimento; o perfil "prod" usa PostgreSQL (RNF02)
spring.datasource.url=jdbc:h2:mem:oncar;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# RN015: sessao expira apos 30 minutos de inatividade
server.servlet.session.timeout=30m

# Mensagens de erro em portugues (RNF13)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
