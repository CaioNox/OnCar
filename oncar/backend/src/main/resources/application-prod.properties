# OnCar - perfil de producao
# As credenciais vem de variaveis de ambiente para permitir a implantacao
# em ambientes distintos sem alteracao de codigo.
spring.datasource.url=${ONCAR_DB_URL:jdbc:postgresql://localhost:5432/oncar}
spring.datasource.username=${ONCAR_DB_USER:oncar}
# Sem valor padrao de proposito: sem ONCAR_DB_PASSWORD a aplicacao nao sobe, em vez de
# tentar uma senha fraca e conhecida.
spring.datasource.password=${ONCAR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.servlet.session.timeout=30m

# Primeiro proprietario, criado apenas enquanto a base nao tiver nenhum usuario
oncar.admin.nome=${ONCAR_ADMIN_NOME:Proprietario}
oncar.admin.email=${ONCAR_ADMIN_EMAIL:}
oncar.admin.senha=${ONCAR_ADMIN_SENHA:}
