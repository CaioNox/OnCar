# OnCar - perfil de producao (RNF02 e RNF11)
# As credenciais vem de variaveis de ambiente para permitir a implantacao
# em ambientes distintos sem alteracao de codigo.
spring.datasource.url=${ONCAR_DB_URL:jdbc:postgresql://localhost:5432/oncar}
spring.datasource.username=${ONCAR_DB_USER:oncar}
spring.datasource.password=${ONCAR_DB_PASSWORD:oncar}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.servlet.session.timeout=30m
